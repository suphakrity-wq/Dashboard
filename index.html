<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<!-- ?v= คือเลขเวอร์ชันของไฟล์ static — GitHub Pages แคชไฟล์ไว้ 10 นาที
     ทุกครั้งที่แก้ CSS/JS แล้ว deploy ให้บวกเลขนี้ 1 ผู้ใช้จะได้เห็นของใหม่ทันที -->
<link rel="stylesheet" href="assets/css/style.css?v=155">
</head>
<body>

<div class="shell">

  <!-- แถบนำทางด้านซ้าย -->
  <aside class="sidebar">
    <div class="side-brand">
      <span class="side-mark"><i class="ms">newspaper</i></span>
      <div>
        <b id="side-title">News Behavior</b>
        <span id="side-sub" class="muted small">ผลสำรวจ</span>
      </div>
    </div>
    <!-- ปุ่มเปิดเมนู: โชว์เฉพาะจอโทรศัพท์ (ดู 3-layout.css) -->
    <button id="nav-toggle" class="nav-toggle" type="button"
            aria-controls="nav" aria-expanded="false" aria-label="เปิดเมนูหมวดหมู่">
      <i class="ms">menu</i>
    </button>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot">
      <!-- เลือกแหล่งข้อมูล: 2 ปุ่มแยกกัน อยู่เหนือปุ่มรีเฟรช (เติมค่าด้วย renderSourcePicker) -->
      <div class="src-pick">
        <span class="src-pick-lbl">แหล่งข้อมูล</span>
        <div class="src-btns" role="group" aria-label="เลือกแหล่งข้อมูล">
          <button id="src-real" class="src-btn" type="button">
            <i class="ms">cloud_done</i><b>ข้อมูลจริง</b>
          </button>
          <button id="src-test" class="src-btn" type="button">
            <i class="ms">science</i><b>ข้อมูลทดลอง</b>
          </button>
        </div>
        <select id="source-pick" class="input" aria-label="เลือกชุดข้อมูลทดลอง" hidden></select>
      </div>
      <span id="demo-flag" class="demo-flag" hidden>โหมดทดลอง · ข้อมูลจำลอง</span>
      <span id="updated" class="muted small"></span>
      <button id="refresh" class="btn btn-ghost btn-block" type="button">รีเฟรชข้อมูล</button>
    </div>
  </aside>

  <!-- เนื้อหา -->
  <main class="content">
    <header class="page-bar">
      <div class="page-bar-top">
        <div>
          <span id="crumb" class="crumb"></span>
          <h1 id="page-title"></h1>
          <p id="page-desc" class="muted"></p>
          <p id="page-answers" class="page-answers" hidden></p>
        </div>
        <div class="page-tools">
          <!-- ตัวกรองก่อน แล้วต่อด้วยแท็บ ทั้งหมด/ชาย/หญิง ให้อยู่แถวเดียวกัน -->
          <div id="filters" class="filters"></div>
          <div id="tabs" class="tabs"></div>
          <!-- ปุ่มกรองคำตอบผิดปกติ (เติมข้อความด้วย renderOddToggle) -->
          <button id="odd-toggle" class="odd-btn" type="button" hidden></button>
        </div>
      </div>
      <div id="summary" class="summary-bar"></div>
    </header>

    <div id="page-body" class="page-body"></div>
    <div id="status" class="status"></div>
    <footer class="page-foot muted small">อัปเดตอัตโนมัติจาก Google Sheet ทุก 3 นาที</footer>
  </main>
</div>

<!-- เก็บไลบรารีไว้ในโปรเจกต์เอง เพื่อให้เว็บทำงานได้แม้เครือข่ายบล็อก CDN -->
<script src="assets/vendor/papaparse.min.js"></script>
<script src="config.js?v=155"></script>
<script type="module" src="assets/js/app.js?v=155"></script>
</body>
</html>
